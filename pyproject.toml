[project]
name = "pokemon-llm"
version = "0.1.0"
description = "Multi-agent Pokémon Q&A system powered by LLMs, RAG, and SQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chonkie>=1.6.1",
    "chromadb>=1.4.0",
    "datasets>=4.4.2",
    "gradio>=6.6.0",
    "html-to-markdown>=2.28.2",
    "ipykernel>=7.1.0",
    "ipython>=8.18.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "litellm>=1.82.4",
    "nest-asyncio>=1.6.0",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "scrapling[all]>=0.4.2",
    "sqlalchemy>=2.0.45",
    "tenacity>=9.1.2",
]

[tool.pyrefly]
project-includes = ["**/*.py","**/*.ipynb"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*venv/**", "**/.gemini/**", "**/.venv/**", "**/*[!/.]*/**"]
use-ignore-files = true
search-path = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
